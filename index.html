<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>圆周旅记｜先看懂，再出发</title>
  <style>
    :root {
      --ink:#17191d;
      --muted:#7d858e;
      --line:#e8eaec;
      --paper:#ffffff;
      --canvas:#eef1ef;
      --cyan:#14aee3;
      --cyan-soft:#edf9fd;
      --map:#e2f1dc;
      --road:#f9fff8;
      --green:#2c8b59;
      --shadow:0 18px 50px rgba(22,38,48,.16);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}
    button{border:0;cursor:pointer;color:inherit}
    button:focus-visible{outline:3px solid rgba(32,189,242,.35);outline-offset:2px}
    .demo-shell{min-height:100%;display:grid;place-items:center;padding:22px;background:#dfe4e1}
    .prototype-note{display:none}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#129fd0;text-transform:uppercase}
    .prototype-note h1{font-size:42px;line-height:1.1;margin:14px 0 18px;letter-spacing:-.04em}
    .prototype-note p{font-size:17px;line-height:1.8;color:#5d646b;margin:0 0 20px}
    .principles{display:grid;gap:10px;margin-top:26px}
    .principle{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #dfe4e1;border-radius:18px;background:rgba(255,255,255,.76)}
    .principle b{font-size:14px}.principle span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
    .step-dot{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:white;font-weight:800;font-size:12px;flex:0 0 auto}
    .device{position:relative;width:min(390px,100vw);height:min(844px,calc(100dvh - 44px));min-height:680px;max-height:844px;background:#f7f8f7;border:7px solid #17191d;border-radius:48px;overflow:hidden;box-shadow:0 28px 80px rgba(22,38,48,.24)}
    .device:after{content:"";position:absolute;z-index:60;left:50%;bottom:5px;transform:translateX(-50%);width:116px;height:4px;border-radius:6px;background:#111;pointer-events:none}
    .statusbar{position:absolute;z-index:20;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:800;pointer-events:none}
    .status-icons{display:flex;align-items:center;gap:7px}.signal{letter-spacing:-2px}.battery{border:2px solid #222;border-radius:5px;padding:1px 4px;font-size:10px}
    .appbar{position:absolute;z-index:18;top:48px;left:0;right:0;height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
    .icon-btn{width:42px;height:42px;background:rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 18px rgba(25,40,50,.08)}
    .icon{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .brand-pill{height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.92);display:flex;align-items:center;gap:7px;color:#1fb5e9;font-weight:800;font-size:13px;box-shadow:0 5px 18px rgba(25,40,50,.06)}
    .brand-mark{width:19px;height:12px;background:#24bdf0;border-radius:2px 2px 8px 8px;position:relative}.brand-mark:after{content:"";position:absolute;right:3px;bottom:-2px;width:8px;height:8px;background:white;transform:rotate(18deg)}
    .progress-track{position:absolute;z-index:19;top:104px;left:18px;right:18px;height:4px;border-radius:5px;background:rgba(255,255,255,.65);overflow:hidden}
    .progress-bar{height:100%;width:12%;background:var(--cyan);transition:width .35s ease}
    .map-stage{position:absolute;inset:0 0 45%;background:#edf2ef;overflow:hidden}
    .amap-container{position:absolute;z-index:0;inset:0;opacity:0;pointer-events:none;transition:opacity .28s ease;background:#edf2ef}
    .map-stage.amap-ready .amap-container{opacity:1;pointer-events:auto}
    .map-stage.amap-ready .map-canvas{opacity:0;pointer-events:none}
    .map-canvas{position:absolute;z-index:1;inset:0;transform-origin:50% 58%;touch-action:none;cursor:grab;will-change:transform;transition:transform .18s ease}
    .map-canvas.is-dragging{cursor:grabbing;transition:none}
    .map-canvas:before,.map-canvas:after{content:"";position:absolute;background:var(--road);border-radius:999px;opacity:.65;transform-origin:center}
    .map-canvas:before{width:540px;height:9px;left:-90px;top:225px;transform:rotate(-13deg)}
    .map-canvas:after{width:450px;height:7px;left:42px;top:135px;transform:rotate(67deg)}
    .map-roads{position:absolute;inset:0;width:100%;height:100%}
    .map-copy{position:absolute;z-index:6;top:112px;left:18px;max-width:235px;pointer-events:none}
    .map-copy h2{font-size:23px;line-height:1.08;margin:0;letter-spacing:-.035em}.map-copy p{font-size:10px;color:#4b5b54;margin:6px 0 0;font-weight:700;line-height:1.4}
    .map-legend{position:absolute;z-index:6;top:171px;left:18px;display:flex;gap:5px;align-items:flex-start;pointer-events:none}
    .legend-chip{background:rgba(255,255,255,.94);padding:7px 10px;border-radius:12px;font-size:10px;font-weight:800;color:#4d5853;box-shadow:0 3px 12px rgba(45,70,55,.06)}
    .pin-layer{position:absolute;z-index:5;inset:0}
    .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;padding:0;transition:transform .2s ease}
    .pin:hover{transform:translate(-50%,-50%) scale(1.06)}
    .pin-dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#168fbe;border:3px solid var(--cyan);font-size:10px;font-weight:900;box-shadow:0 4px 10px rgba(18,74,86,.16)}
    .pin.is-must .pin-dot{background:var(--ink);color:#fff;border-color:#fff}.pin.is-route-step .pin-dot{background:var(--cyan);color:#fff;border-color:#fff}.pin.is-offroute .pin-dot{border-color:#aab8af;color:#7a8780;background:#f8fbf8;transform:scale(.84)}.pin.is-hidden{display:none}
    .pin-label{display:none;white-space:nowrap;font-size:10px;font-weight:850;background:rgba(255,255,255,.96);padding:4px 7px;border-radius:8px;box-shadow:0 3px 8px rgba(20,45,35,.08)}
    .pin.is-focused .pin-label{display:block}
    .route-path{fill:none;stroke:var(--cyan);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(255,255,255,.85));transition:all .3s ease;opacity:0}
    .map-stage.show-route .route-path{opacity:1}
    .map-controls{position:absolute;z-index:8;right:15px;top:118px;width:38px;background:rgba(255,255,255,.96);border-radius:15px;box-shadow:0 6px 18px rgba(33,65,48,.12);overflow:hidden}
    .map-controls button{width:38px;height:36px;background:transparent;font-size:19px;font-weight:700;border-bottom:1px solid #edf0ee}.map-controls button:last-child{border-bottom:0;font-size:16px}.map-controls button:active{background:#edf9fd}
    .map-provider{position:absolute;z-index:8;right:60px;top:118px;height:31px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.96);box-shadow:0 5px 16px rgba(33,65,48,.1);font-size:9px;font-weight:850;color:#667078;backdrop-filter:blur(12px)}
    .map-provider.loading{color:#168eb7}.map-provider.connected{background:rgba(23,25,29,.9);color:#fff}.map-provider.error{color:#b45d3c}
    .real-map-item{position:relative;width:34px;height:34px;display:grid;place-items:center;background:transparent;padding:0;white-space:nowrap;cursor:pointer;overflow:visible}
    .real-map-marker{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.98);color:#128ab5;border:2.5px solid #fff;font-size:10px;font-weight:900;box-shadow:0 0 0 2px #19ade0,0 6px 16px rgba(20,58,72,.2);transition:transform .18s ease,opacity .18s ease}
    .real-map-item:hover .real-map-marker{transform:scale(1.08)}
    .real-map-marker.must{background:var(--ink);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(23,25,29,.22),0 6px 16px rgba(20,38,48,.26)}
    .real-map-marker.route{width:33px;height:33px;background:#10aee3;color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(16,174,227,.22),0 8px 20px rgba(10,110,148,.25)}
    .real-map-marker.route.must{background:var(--ink);box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(23,25,29,.2),0 8px 20px rgba(20,38,48,.26)}
    .real-map-marker.offroute{width:21px;height:21px;border-color:#fff;color:#7e8884;background:#eef2f0;box-shadow:0 0 0 1px #aeb8b3,0 4px 10px rgba(38,58,48,.13);opacity:.72}
    .real-map-label{position:absolute;z-index:-1;max-width:112px;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.96);border:1px solid rgba(20,50,62,.07);border-radius:9px;padding:5px 8px;color:#222a2e;font-size:9px;line-height:1;font-weight:850;box-shadow:0 5px 14px rgba(20,45,55,.12);backdrop-filter:blur(10px);pointer-events:none}
    .real-map-item.label-right .real-map-label{left:39px;top:50%;transform:translateY(-50%)}
    .real-map-item.label-left .real-map-label{right:39px;top:50%;transform:translateY(-50%)}
    .real-map-item.label-top .real-map-label{left:50%;bottom:42px;transform:translateX(-50%)}
    .real-map-item.label-bottom .real-map-label{left:50%;top:42px;transform:translateX(-50%)}
    .real-map-item.label-hidden .real-map-label{display:none}
    .real-map-item:focus-visible .real-map-label,.real-map-item:hover .real-map-label{display:block}
    .amap-logo,.amap-copyright{transform:scale(.72);transform-origin:left bottom}
    .map-gesture-hint{position:absolute;z-index:6;left:50%;bottom:28%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:12px;padding:6px 9px;font-size:9px;color:#607067;font-weight:750;pointer-events:none;transition:opacity .25s ease;white-space:nowrap}.map-gesture-hint.hide{opacity:0}
    .sheet{position:absolute;z-index:10;left:0;right:0;bottom:0;height:45%;background:var(--paper);border-radius:32px 32px 0 0;box-shadow:0 -8px 28px rgba(31,49,58,.08);display:flex;flex-direction:column;transition:height .25s ease;overflow:hidden}
    #screenContent{display:contents}
    #screenContent.entering .sheet-head,#screenContent.entering .tabs,#screenContent.entering .content,#screenContent.entering .bottom-actions{animation:screenIn .25s cubic-bezier(.2,.8,.2,1) both}
    #screenContent.entering .tabs{animation-delay:.02s}#screenContent.entering .content{animation-delay:.04s}#screenContent.entering .bottom-actions{animation-delay:.06s}
    @keyframes screenIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
    .grabber{width:44px;height:5px;background:#cbd0d1;border-radius:8px;margin:10px auto 4px;flex:0 0 auto}
    .sheet-head{padding:10px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .sheet-head h3{font-size:24px;line-height:1.15;margin:0 0 5px;letter-spacing:-.03em}.sheet-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
    .text-btn{background:#eff2f1;border-radius:16px;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}.text-btn.cyan{background:var(--cyan-soft);color:#138db8}
    .tabs{display:flex;gap:8px;padding:7px 20px 11px;overflow:auto;scrollbar-width:none;flex:0 0 auto}.tabs::-webkit-scrollbar{display:none}
    .tab{background:#f2f4f3;border-radius:14px;padding:9px 12px;font-size:12px;font-weight:750;white-space:nowrap}.tab.active{background:var(--ink);color:white}
    .content{flex:1;overflow:auto;padding:0 20px 112px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}
    .spot-list{display:grid;gap:0;border:1px solid #edf0ee;border-radius:20px;overflow:hidden}
    .spot-card{position:relative;width:100%;background:#fff;border:0;border-bottom:1px solid #edf0ee;border-radius:0;padding:11px;text-align:left;display:grid;grid-template-columns:58px 1fr auto;gap:11px;align-items:center;transition:.18s ease}
    .spot-card:last-child{border-bottom:0}.spot-card:hover{background:#f8fbfc}.spot-card.selected{background:var(--cyan-soft)}
    .thumb{width:58px;height:58px;border-radius:15px;background-size:cover;background-position:center;position:relative;overflow:hidden}.thumb:after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.06);border-radius:inherit}
    .spot-main{min-width:0}.spot-title{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spot-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:10px;color:#657078}.tag{padding:3px 6px;border-radius:7px;background:#f1f3f2;font-weight:750;color:#667078}.tag.fit{color:#168eb7;background:var(--cyan-soft)}.tag.hot,.tag.saved{color:#667078}
    .map-index{position:absolute;left:50px;top:7px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#fff;font-size:9px;font-weight:900;border:2px solid #fff}
    .choice-dot{width:29px;height:29px;border-radius:50%;background:white;border:1px solid #dfe4e2;display:grid;place-items:center;font-size:13px;font-weight:900}.spot-card.selected .choice-dot{background:var(--ink);color:white;border-color:var(--ink)}
    .bottom-actions{position:absolute;z-index:15;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);display:grid;grid-template-columns:1fr 1.45fr;gap:10px;border-top:1px solid #eff1f0}
    .btn{min-height:52px;border-radius:22px;font-weight:850;font-size:15px;padding:0 16px;transition:transform .12s ease,opacity .12s ease}.btn:active,.icon-btn:active,.tab:active,.spot-card:active,.transport-card:active,.route-card:active{transform:scale(.975)}.btn.secondary{background:#f1f3f2}.btn.primary{background:var(--ink);color:white}.btn.primary.cyan{background:var(--cyan);color:#083244}.btn[disabled]{opacity:.42;cursor:not-allowed}
    .inline-count{font-size:11px;color:var(--muted);font-weight:650;display:block;margin-top:2px}
    .banner{border-radius:20px;padding:14px 15px;margin-bottom:12px;background:#f6f8f7}.banner.cyan{background:var(--cyan-soft)}.banner b{display:block;font-size:14px;margin-bottom:4px}.banner p{margin:0;color:#657078;font-size:11px;line-height:1.55}
    .import-card{background:#f8f9f8;border-radius:22px;padding:12px;display:grid;grid-template-columns:62px 1fr;gap:12px;margin:2px 0 12px}.import-collage{height:62px;border-radius:15px;background:#dce8d4;display:grid;grid-template-columns:1fr 1fr;gap:2px;overflow:hidden}.import-collage i:nth-child(1){background:#8cad74}.import-collage i:nth-child(2){background:#e4a575}.import-collage i:nth-child(3){background:#7ca2b4}.import-collage i:nth-child(4){background:#5a7553}.import-card b{font-size:14px;line-height:1.35}.import-card p{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.5}
    .transport-list,.route-list{display:grid;gap:10px}
    .transport-card,.route-card{position:relative;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:22px;background:#fff;padding:14px 14px 13px;transition:.18s ease}.transport-card.selected,.route-card.selected{border-color:var(--cyan);background:var(--cyan-soft)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-name{display:flex;gap:10px;align-items:center}.mode-icon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#f0f3f3;font-size:20px}.transport-card.selected .mode-icon{background:#fff}.card-name b{font-size:16px}.recommend{font-size:9px;font-weight:850;padding:4px 6px;border-radius:7px;background:var(--cyan-soft);color:#168eb7}
    .stats{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}.stat{background:#f4f6f5;border-radius:10px;padding:6px 8px;font-size:10px;font-weight:750}.selected .stat{background:#fff}
    .card-desc{font-size:11px;color:#68727a;line-height:1.55;margin:0}.tradeoff{font-size:10px;color:#717b82;margin-top:7px;font-weight:750}
    .anchor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.anchor-card{border:1px solid var(--line);border-radius:20px;padding:13px;background:#fff}.anchor-card b{font-size:13px}.anchor-card p{font-size:10px;color:var(--muted);line-height:1.5;margin:6px 0 10px}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#f0f2f1;border-radius:11px;padding:3px}.segment{padding:8px 5px;border-radius:9px;background:transparent;font-size:10px;font-weight:800}.segment.active{background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.06)}
    .constraint{margin-top:10px;border:1px dashed #cbd3d0;border-radius:17px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}.constraint button{background:#f0f3f1;padding:7px 9px;border-radius:10px;font-weight:800}
    .route-card{padding:15px}.route-card .card-top b{font-size:17px}.route-card .mini-map{height:72px;border-radius:16px;background:#dff0d9;margin:12px 0;position:relative;overflow:hidden}.mini-map:before{content:"";position:absolute;width:120%;height:6px;background:white;left:-10%;top:35px;transform:rotate(-8deg);border-radius:9px}.mini-route{position:absolute;inset:0;width:100%;height:100%}.route-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{background:#f4f6f5;border-radius:11px;padding:7px;text-align:center}.selected .metric{background:#fff}.metric b{font-size:12px;display:block}.metric span{font-size:9px;color:var(--muted)}.route-summary{font-size:10px;color:#687078;line-height:1.55;margin:9px 0 0}.route-fit{font-size:10px;color:#1b8dac;font-weight:800;margin-top:8px}
    .day-strip{display:flex;gap:7px;padding:4px 0 12px;overflow:auto;scrollbar-width:none}.day-chip{min-width:67px;border-radius:14px;background:#f2f4f3;padding:9px 7px;text-align:center}.day-chip.active{background:var(--ink);color:#fff}.day-chip b{display:block;font-size:12px}.day-chip span{font-size:9px;color:#8c9498}.day-chip.active span{color:#c7cccf}
    .day-overview{background:#f5f7f6;border-radius:18px;padding:12px;margin-bottom:12px}.day-overview .row{display:flex;justify-content:space-between;gap:8px}.day-overview b{font-size:14px}.day-overview p{font-size:10px;color:#687078;line-height:1.55;margin:7px 0 0}
    .timeline{display:grid}.event{position:relative;display:grid;grid-template-columns:43px 1fr;gap:10px;padding-bottom:15px}.event:before{content:"";position:absolute;left:20px;top:34px;bottom:-1px;width:2px;background:#e2e7e4}.event:last-child:before{display:none}.event-time{font-size:10px;color:#7a8388;font-weight:800;padding-top:7px}.event-card{border:1px solid #edf0ee;border-radius:17px;padding:11px;background:#fff;text-align:left}.event-card b{font-size:13px}.event-card p{font-size:10px;color:#717b82;line-height:1.5;margin:6px 0 0}.event-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.event-meta span{font-size:9px;background:#f2f4f3;padding:4px 6px;border-radius:7px}.risk{color:#b7633d!important;background:#fff0e8!important}.event-card.deleted{display:none}
    .edit-hero{background:#f5f7f6;border-radius:22px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:60px 1fr;gap:12px}.edit-hero .thumb{width:60px;height:60px}.edit-hero b{font-size:16px}.edit-hero p{font-size:10px;color:#677169;line-height:1.5;margin:5px 0 0}

          <section class="chat-context"><div class="chat-context-head"><b>当前 4 天计划</b><span>上下文已载入</span></div><div class="context-days">${days.map(day=>`<div class="context-day"><b>${day[0]}</b>${day[1]}</div>`).join('')}</div><div class="constraint-strip"><span>🚗 租车</span><span>☀️ 不早起</span><span>🏡 D1 和顺住宿</span><span>✈️ D4 19:45返程</span></div></section>
          <div class="chat-thread">${state.chatMessages.map(message=>`<div class="chat-message ${message.role}">${escapeHtml(message.text).replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g,'<b>$1</b>')}</div>`).join('')}</div>
          <div class="prompt-chips"><button class="prompt-chip" data-prompt="D2 不要太赶，但保留北海湿地">D2 不要太赶</button><button class="prompt-chip" data-prompt="把北海湿地改到下午去">北海湿地改到下午</button><button class="prompt-chip" data-prompt="准备一个下雨天的备选方案">准备雨天方案</button></div>
        </div>
        <div class="chat-composer"><input class="chat-input" id="aiChatInput" autocomplete="off" placeholder="例如：D3 下午删掉叠水河"><button class="chat-send" data-action="send-chat" aria-label="发送">↑</button></div>`;
    }
    function renderEdit(){
      const impact = state.editDecision==='no'
        ? {cls:'danger',title:'删除后不自动补点',body:'D2 将空出约 2.5 小时。热海可提前到 15:20，AI只重算剩余路线，不会擅自加入新景点。'}
        : state.editOrder==='我来排序'
        ? {cls:'warn',title:'当前顺序会多走 38 分钟',body:'先去热海再回北海湿地会形成折返。你仍可保存，或改用“AI顺路”。'}
        : {cls:'good',title:'调整后仍然顺路',body:`北海湿地安排在 ${state.editDay} ${state.editTime}，位于火山与热海之间，预计减少 22 km 折返。`};
      return header('编辑 · 北海湿地','只改你选择的维度，保存前先看影响','<button class="text-btn" data-action="close-edit">取消</button>')+`
        <div class="content"><div class="edit-hero"><span class="thumb" style="background-image:url('${spots[2].img}')"></span><span><b>北海湿地</b><p>城北高原湿地 · 适合你 96%<br>已收藏 · 当前安排 D2 14:10</p></span></div>
        <div class="decision"><button class="${state.editDecision==='go'?'active':''}" data-decision="go">去</button><button class="no ${state.editDecision==='no'?'active':''}" data-decision="no">不去，直接删除</button></div>
        ${state.editDecision==='go'?`<div class="form-block"><div class="form-label">改到哪天 <small>住宿与航班是固定锚点</small></div><div class="option-row">${['10.23','10.24','10.25','10.26'].map(x=>`<button class="option ${state.editDay===x?'active':''}" data-edit-day="${x}">${x}</button>`).join('')}</div></div>
        <div class="form-block"><div class="form-label">什么时段</div><div class="option-row">${['上午','下午','晚上'].map(x=>`<button class="option ${state.editTime===x?'active':''}" data-edit-time="${x}">${x}</button>`).join('')}</div></div>
        <div class="form-block"><div class="form-label">空间顺序 <small>你决定，AI只给影响</small></div><div class="option-row">${['AI顺路','火山之后','热海之后','我来排序'].map(x=>`<button class="option ${state.editOrder===x?'active':''}" data-edit-order="${x}">${x}</button>`).join('')}</div></div>`:''}
        <div class="impact ${impact.cls}"><b>${impact.title}</b><p>${impact.body}</p></div></div>
        ${actions('返回计划','close-edit',state.editDecision==='no'?'确认删除':'保存修改','save-edit')}`;
    }
    function renderManual(){
      return header('手动规划工作台','你选择点和日期，AI帮你计算顺路','<button class="text-btn cyan" data-action="ai-order">AI 帮我顺路</button>')+`
        <div class="content"><div class="banner cyan"><b>未安排收藏 · 5 个</b><p>从小红书导入的地点先放在这里，拖入某天或点“＋加入”。</p></div>
        <div class="manual-pool">${spots.filter(s=>s.saved).slice(0,4).map(s=>`<div class="pool-card"><b>${s.name}</b><span>${s.region}</span><button data-pool="${s.id}">＋ 加入某天</button></div>`).join('')}</div>
        <div class="day-overview"><div class="row"><b>D1 · 和顺片区</b><span class="tag fit">2 个点</span></div><p>和顺古镇 → 野鸭湖日落 · 区内步行</p></div>
        <div class="day-overview"><div class="row"><b>D2 · 城北片区</b><span class="tag">待安排</span></div><p>火山、北海湿地、热海可组合；当前尚未确认顺序。</p></div>
        <div class="banner"><b>手动不等于从零填表</b><p>你负责“去哪里、放哪天”；AI负责计算距离、营业时间冲突和建议顺序。</p></div></div>
        ${actions('返回一图看懂','back','预览我的路线','manual-preview')}`;
    }
    function render(){
      device.classList.toggle('is-chat',state.screen==='chat');
      updateMap();renderPins();
      const html=state.screen==='import'?renderImport():state.screen==='overview'?renderOverview():state.screen==='transport'?renderTransport():state.screen==='routes'?renderRoutes():state.screen==='detail'?renderDetail():state.screen==='chat'?renderChat():state.screen==='edit'?renderEdit():renderManual();
      screenContent.classList.remove('entering');
      screenContent.innerHTML=html;
      requestAnimationFrame(()=>screenContent.classList.add('entering'));
      if(amapState.ready)requestAnimationFrame(()=>{amapState.map.resize();fitAmapView()});
      document.getElementById('backBtn').style.visibility=(state.screen==='import'&&state.history.length===0)?'hidden':'visible';
    }

    document.getElementById('backBtn').addEventListener('click',goBack);
    document.getElementById('resetBtn').addEventListener('click',reset);
    document.getElementById('snackbarAction').addEventListener('click',()=>{state.deleted=false;hideSnack();setScreen('detail',false)});
    mapStage.addEventListener('click',e=>{
      const control=e.target.closest('[data-map-control]');if(!control)return;
      if(amapState.ready){if(control.dataset.mapControl==='in')amapState.map.zoomIn();if(control.dataset.mapControl==='out')amapState.map.zoomOut();if(control.dataset.mapControl==='fit')fitAmapView();return}
      if(control.dataset.mapControl==='in')zoomMap(.3);if(control.dataset.mapControl==='out')zoomMap(-.3);if(control.dataset.mapControl==='fit')resetMapView(true);
    });
    mapProvider.addEventListener('click',showAmapConfig);
    mapCanvas.addEventListener('wheel',e=>{e.preventDefault();zoomMap(e.deltaY<0?.2:-.2)},{passive:false});
    mapCanvas.addEventListener('pointerdown',e=>{
      mapPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});mapCanvas.setPointerCapture(e.pointerId);mapCanvas.classList.add('is-dragging');mapHint.classList.add('hide');
      if(mapPointers.size===1){mapGesture={startX:e.clientX,startY:e.clientY,originX:mapView.x,originY:mapView.y,distance:0,scale:mapView.scale,moved:false}}
      if(mapPointers.size===2){const p=[...mapPointers.values()];mapGesture.distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);mapGesture.scale=mapView.scale}
    });
    mapCanvas.addEventListener('pointermove',e=>{
      if(!mapPointers.has(e.pointerId))return;mapPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(mapPointers.size===2){const p=[...mapPointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(mapGesture.distance){mapView.scale=Math.max(.85,Math.min(2.4,mapGesture.scale*d/mapGesture.distance));mapGesture.moved=true;applyMapTransform()}}
      else{const dx=e.clientX-mapGesture.startX,dy=e.clientY-mapGesture.startY;if(Math.hypot(dx,dy)>4)mapGesture.moved=true;mapView.x=mapGesture.originX+dx;mapView.y=mapGesture.originY+dy;applyMapTransform()}
    });
    function endMapPointer(e){mapPointers.delete(e.pointerId);if(!mapPointers.size)mapCanvas.classList.remove('is-dragging')}
    mapCanvas.addEventListener('pointerup',endMapPointer);mapCanvas.addEventListener('pointercancel',endMapPointer);
    modal.addEventListener('click',e=>{if(e.target===modal)hideModal()});
    pinLayer.addEventListener('click',e=>{const p=e.target.closest('[data-pin]');if(!p||mapGesture.moved){mapGesture.moved=false;return}openSpotModal(spots.find(x=>x.id===p.dataset.pin))});
    screenContent.addEventListener('click',e=>{
      const a=e.target.closest('[data-action]');
      if(a){
        const action=a.dataset.action;
        if(action==='back')goBack();
        if(action==='skip-import'||action==='import-notes'){state.imported=action==='import-notes';setScreen('overview');if(state.imported)showSnack('已导入旅行收藏池，不会自动塞入某一天',false)}
        if(action==='open-source')showModal('<h3>收藏来源预览</h3><p>这里会展示原笔记标题、作者、识别到的地点，以及地点匹配置信度。Demo 中仅演示导入逻辑。</p><button class="btn primary" style="width:100%" data-modal="close">知道了</button>'),setTimeout(()=>{const b=document.querySelector('[data-modal="close"]');if(b)b.onclick=hideModal},0);
        if(action==='why-rank')showModal('<h3>排序不是单一热度榜</h3><p><b>全网综合</b>：UGC 提及、评分、近期热度与季节适配。<br><b>适合你</b>：自然、文化、美食偏好与同行人、体力节奏。<br><b>已收藏</b>：你明确表达过兴趣的内容。</p><button class="btn primary" style="width:100%" data-modal="close">知道了</button>'),setTimeout(()=>document.querySelector('[data-modal="close"]').onclick=hideModal,0);
        if(action==='manual')setScreen('manual');
        if(action==='to-transport')setScreen('transport');
        if(action==='transport-data')showModal('<h3>交通建议如何得出</h3><p>基于景点分布、同行人数、4 天行程、出发节奏与当地可达性估算。价格为参考区间，最终以实时平台为准。</p><button class="btn primary" style="width:100%" data-modal="close">知道了</button>'),setTimeout(()=>document.querySelector('[data-modal="close"]').onclick=hideModal,0);
        if(action==='confirm-anchors')showAnchors();
        if(action==='compare-routes')showModal('<h3>三方案只改变“旅行性格”</h3><p>必去点、住宿和航班不会被改动。差异主要来自景点数量、每天启动时间、跨区距离与主题偏好。</p><button class="btn primary" style="width:100%" data-modal="close">知道了</button>'),setTimeout(()=>document.querySelector('[data-modal="close"]').onclick=hideModal,0);
        if(action==='to-detail')setScreen('detail');
        if(action==='show-overview')showSnack('地图已显示 D1–D4 分区：西南 → 北部 → 市区 → 机场',false);
        if(action==='ask-ai')setScreen('chat');
        if(action==='send-chat')submitAiPrompt(document.getElementById('aiChatInput')?.value);
        if(action==='manual-edit')setScreen('edit');
        if(action==='close-edit')goBack();
        if(action==='save-edit'){if(state.editDecision==='no'){state.deleted=true;state.day=1;setScreen('detail');showSnack('已删除北海湿地；没有自动补入其他景点',true)}else{state.day=1;setScreen('detail');showSnack(`已调整至 ${state.editDay} ${state.editTime} · ${state.editOrder}`,false)}}
        if(action==='ai-order'){state.route='balanced';showSnack('已按住宿与全程距离生成顺路预览，尚未替你保存',false)}
        if(action==='manual-preview')setScreen('routes');
      }
      const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render()}
      const s=e.target.closest('[data-spot]');if(s)toggleMust(s.dataset.spot);
      const t=e.target.closest('[data-transport]');if(t){state.transport=t.dataset.transport;render()}
      const r=e.target.closest('[data-route]');if(r){state.route=r.dataset.route;render()}
      const d=e.target.closest('[data-day]');if(d){state.day=+d.dataset.day;render()}
      const ev=e.target.closest('[data-event]');if(ev&&ev.dataset.event==='北海湿地')setScreen('edit');
      const dec=e.target.closest('[data-decision]');if(dec){state.editDecision=dec.dataset.decision;render()}
      const ed=e.target.closest('[data-edit-day]');if(ed){state.editDay=ed.dataset.editDay;render()}
      const et=e.target.closest('[data-edit-time]');if(et){state.editTime=et.dataset.editTime;render()}
      const eo=e.target.closest('[data-edit-order]');if(eo){state.editOrder=eo.dataset.editOrder;render()}
      const prompt=e.target.closest('[data-prompt]');if(prompt)submitAiPrompt(prompt.dataset.prompt);
      const pool=e.target.closest('[data-pool]');if(pool)showModal('<h3>加入哪一天？</h3><p>选择日期后，地点会进入当天“待排序区”，不会立刻改变其他点。</p><div class="option-row">'+['10.23','10.24','10.25','10.26'].map(x=>`<button class="option" data-pool-day="${x}">${x}</button>`).join('')+'</div>'),setTimeout(()=>document.querySelectorAll('[data-pool-day]').forEach(b=>b.onclick=()=>{hideModal();showSnack('已加入 '+b.dataset.poolDay+' 待排序区',false)}),0);
    });
    screenContent.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiChatInput'){e.preventDefault();submitAiPrompt(e.target.value)}});
    function toggleMust(id){
      state.focusSpot=id;
      if(state.must.has(id))state.must.delete(id);else if(state.must.size<3)state.must.add(id);else{showSnack('最多选择 3 个必去点，避免方案失去取舍',false);return}render();
    }
    function showAnchors(){
      showModal(`<h3>两个锚点确认</h3><p>住宿与往返交通一旦确定，会成为路线不可移动的硬约束。</p><div class="anchor-grid"><div class="anchor-card"><b>住宿定了吗？</b><p>已识别：D1 和顺古镇<br>D2–D3 市区酒店</p><div class="segmented"><button class="segment ${state.hotel==='yes'?'active':''}" data-anchor="hotel:yes">定了</button><button class="segment ${state.hotel==='no'?'active':''}" data-anchor="hotel:no">没定</button></div></div><div class="anchor-card"><b>往返交通定了吗？</b><p>去程 11:20 抵达<br>返程时间尚未确认</p><div class="segmented"><button class="segment ${state.flight==='yes'?'active':''}" data-anchor="flight:yes">定了</button><button class="segment ${state.flight==='no'?'active':''}" data-anchor="flight:no">没定</button></div></div></div><div class="constraint"><span>节奏：不早起 · 3 人同行</span><button data-anchor="pace">可修改</button></div><button class="btn primary" style="width:100%;margin-top:13px" data-anchor="continue">生成 3 个路线方向</button>`);
      document.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=()=>{const v=b.dataset.anchor;if(v==='continue'){hideModal();setScreen('routes');return}if(v==='pace'){showSnack('当前节奏：每天 10:00 左右出发',false);return}const [k,val]=v.split(':');state[k]=val;showAnchors()});
    }
    render();
    initAmap(readAmapConfig()||DEFAULT_AMAP_CONFIG);
  </script>
</body>
</html>
